; Tiered Casters 1.0.0 - Alteration Armour Spells
; The armour-spell ladder, handed out by Alteration skill rather than by archetype, so a warlock and a shaman both get what they trained for.
;
; Requires: Spell Perk Item Distributor (SPID) 7.x by powerofthree
;   https://www.nexusmods.com/skyrimspecialedition/mods/36869
; Install: drop this file into Skyrim Special Edition/Data (mod managers do it for you).
; Remove: delete this file. Nothing is written to your save.
;
; Line format:
;   Spell = <EditorID>|<string filters>|<form filters>|<level filters>|<traits>|<count>|<chance>
;   - string filters: NPC name or EditorID, * is a wildcard
;   - level filters : <level>,<schoolIndex>(<skill>)  -> both floors must be met
;   - traits        : -U not unique, -C not a child, -T not a teammate
;   - chance        : 0-100, the ! suffix makes the roll deterministic per NPC per save
;
; Applies to: *Necromancer,*Warlock,*Conjurer,*Shaman,*Vampire,*Pyromancer,*Cryomancer,*Electromancer

;   Oakflesh         Alteration   skill 20  -> 55%  (Alteration 20)
Spell = Oakflesh|*Necromancer,*Warlock,*Conjurer,*Shaman,*Vampire,*Pyromancer,*Cryomancer,*Electromancer|NONE|12(20)|-U/-C/-T|1|55!
;   Stoneflesh       Alteration   skill 40  -> 50%  (Alteration 40)
Spell = Stoneflesh|*Necromancer,*Warlock,*Conjurer,*Shaman,*Vampire,*Pyromancer,*Cryomancer,*Electromancer|NONE|12(40)|-U/-C/-T|1|50!
;   Ironflesh        Alteration   skill 60  -> 40%  (Alteration 60)
Spell = Ironflesh|*Necromancer,*Warlock,*Conjurer,*Shaman,*Vampire,*Pyromancer,*Cryomancer,*Electromancer|NONE|12(60)|-U/-C/-T|1|40!
;   Ebonyflesh       Alteration   skill 80  -> 30%  (Alteration 80)
Spell = Ebonyflesh|*Necromancer,*Warlock,*Conjurer,*Shaman,*Vampire,*Pyromancer,*Cryomancer,*Electromancer|NONE|12(80)|-U/-C/-T|1|30!

; 4 distribution lines in this module.
