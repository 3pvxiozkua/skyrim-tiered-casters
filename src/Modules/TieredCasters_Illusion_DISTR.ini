; Tiered Casters 1.0.0 - Illusion Pressure
; Fury, Fear and Calm handed to the casters whose lore supports them. Off by default because fear and calm effects change how a fight reads.
;
; Requires: Spell Perk Item Distributor (SPID) 7.x by powerofthree
;   https://www.nexusmods.com/skyrimspecialedition/mods/36869
; Install: drop this file into Skyrim Special Edition/Data (mod managers do it for you).
; Remove: delete this file. Nothing is written to your save.
;
; Line format:
;   Spell = <EditorID>|<string filters>|<form filters>|<level filters>|<traits>|<count>|<chance>
;   - string filters: NPC name or EditorID, * is a wildcard
;   - level filters : <level>/,<schoolIndex>(<skill>/)  -> both floors must be met
;   - traits        : -U not unique, -C not a child, -T not a teammate
;   - chance        : 0-100, the ! suffix makes the roll deterministic per NPC per save
;
; Applies to: *Necromancer,*Warlock,*Conjurer,*Shaman,*Vampire,*Pyromancer,*Cryomancer,*Electromancer

;   Fury             Illusion     skill 30  -> 45%  (Illusion 30)
Spell = Fury|*Necromancer,*Warlock,*Conjurer,*Shaman,*Vampire,*Pyromancer,*Cryomancer,*Electromancer|NONE|15(30/)|-U/-C/-T|1|45!
;   Fear             Illusion     skill 45  -> 40%  (Illusion 45)
Spell = Fear|*Necromancer,*Warlock,*Conjurer,*Shaman,*Vampire,*Pyromancer,*Cryomancer,*Electromancer|NONE|15(45/)|-U/-C/-T|1|40!
;   Calm             Illusion     skill 60  -> 25%  (Illusion 60)
Spell = Calm|*Necromancer,*Warlock,*Conjurer,*Shaman,*Vampire,*Pyromancer,*Cryomancer,*Electromancer|NONE|15(60/)|-U/-C/-T|1|25!

; 3 distribution lines in this module.
