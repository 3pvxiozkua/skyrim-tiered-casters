; Tiered Casters 1.0.0 - Standard preset
; The intended experience: every archetype reaches its full table, gated by level and by the skill the spell actually needs.
;
; Requires: Spell Perk Item Distributor (SPID) 7.x by powerofthree
;   https://www.nexusmods.com/skyrimspecialedition/mods/36869
; Install: drop this file into Skyrim Special Edition/Data (mod managers do it for you).
; Remove: delete this file. Nothing is written to your save.
;
; Line format:
;   Spell = <EditorID>|<string filters>|<form filters>|<level filters>|<traits>|<count>|<chance>
;   - string filters: NPC name or EditorID, * is a wildcard
;   - level filters : <level>/,<schoolIndex>(<skill>/)  -> both floors must be met
;   - traits        : -U not unique, -C not a child, -T not a teammate
;   - chance        : 0-100, the ! suffix makes the roll deterministic per NPC per save
;

; --- Necromancer ---------------------------------------------------------
; Vanilla necromancers lean on Conjuration and Destruction but only ever carry the opening spells of both schools.
;   ConjureFamiliar          Conjuration  skill 25  level 10  -> 70%  (first summon, so a fresh necromancer has a bodyguard)
Spell = ConjureFamiliar|*Necromancer|NONE|10/,13(25/)|-U/-C/-T|1|70!
;   Firebolt                 Destruction  skill 30  level 12  -> 70%  (replaces Flames as the default attack)
Spell = Firebolt|*Necromancer|NONE|12/,14(30/)|-U/-C/-T|1|70!
;   RaiseZombie              Conjuration  skill 40  level 18  -> 60%  (starts recycling the corpses the player leaves behind)
Spell = RaiseZombie|*Necromancer|NONE|18/,13(40/)|-U/-C/-T|1|60!
;   IceSpike                 Destruction  skill 40  level 20  -> 60%  (second element, so fights are not all fire)
Spell = IceSpike|*Necromancer|NONE|20/,14(40/)|-U/-C/-T|1|60!
;   ConjureFlameAtronach     Conjuration  skill 50  level 28  -> 55%  (mid-game summon)
Spell = ConjureFlameAtronach|*Necromancer|NONE|28/,13(50/)|-U/-C/-T|1|55!
;   Fireball                 Destruction  skill 55  level 30  -> 55%  (area pressure once Destruction is trained)
Spell = Fireball|*Necromancer|NONE|30/,14(55/)|-U/-C/-T|1|55!
;   Incinerate               Destruction  skill 70  level 45  -> 45%  (expert tier, reserved for late-game casters)
Spell = Incinerate|*Necromancer|NONE|45/,14(70/)|-U/-C/-T|1|45!

; --- Warlock ---------------------------------------------------------
; Shock specialists. Vanilla warlocks never get past Lightning Bolt, and they never use the armour spells their Alteration skill pays for.
;   LightningBolt            Destruction  skill 30  level 10  -> 70%  (core attack)
Spell = LightningBolt|*Warlock|NONE|10/,14(30/)|-U/-C/-T|1|70!
;   Stoneflesh               Alteration   skill 30  level 14  -> 55%  (survives the first arrow volley)
Spell = Stoneflesh|*Warlock|NONE|14/,12(30/)|-U/-C/-T|1|55!
;   ChainLightning           Destruction  skill 50  level 26  -> 55%  (punishes players who bring followers)
Spell = ChainLightning|*Warlock|NONE|26/,14(50/)|-U/-C/-T|1|55!
;   Ironflesh                Alteration   skill 55  level 34  -> 45%  (armour spell upgrade)
Spell = Ironflesh|*Warlock|NONE|34/,12(55/)|-U/-C/-T|1|45!
;   Thunderbolt              Destruction  skill 70  level 45  -> 45%  (expert tier)
Spell = Thunderbolt|*Warlock|NONE|45/,14(70/)|-U/-C/-T|1|45!

; --- Conjurer ---------------------------------------------------------
; Pure summoners. Their whole identity is the summon list, and vanilla stops it at Flame Atronach.
;   ConjureFamiliar          Conjuration  skill 25  level 8   -> 75%  (always-on opening summon)
Spell = ConjureFamiliar|*Conjurer|NONE|8/,13(25/)|-U/-C/-T|1|75!
;   ConjureFlameAtronach     Conjuration  skill 40  level 18  -> 60%  (second summon tier)
Spell = ConjureFlameAtronach|*Conjurer|NONE|18/,13(40/)|-U/-C/-T|1|60!
;   ConjureFrostAtronach     Conjuration  skill 55  level 28  -> 50%  (third summon tier)
Spell = ConjureFrostAtronach|*Conjurer|NONE|28/,13(55/)|-U/-C/-T|1|50!
;   ConjureStormAtronach     Conjuration  skill 70  level 40  -> 40%  (top summon tier)
Spell = ConjureStormAtronach|*Conjurer|NONE|40/,13(70/)|-U/-C/-T|1|40!

; --- Forsworn Shaman ---------------------------------------------------------
; Reach shamans are Restoration/Illusion casters in the lore and single-school spell plinkers in the game.
;   Oakflesh                 Alteration   skill 25  level 8   -> 55%  (cheap early defence)
Spell = Oakflesh|*Shaman|NONE|8/,12(25/)|-U/-C/-T|1|55!
;   FastHealing              Restoration  skill 25  level 10  -> 65%  (heals through the first burst of damage)
Spell = FastHealing|*Shaman|NONE|10/,16(25/)|-U/-C/-T|1|65!
;   Fury                     Illusion     skill 25  level 12  -> 55%  (turns the camp against itself)
Spell = Fury|*Shaman|NONE|12/,15(25/)|-U/-C/-T|1|55!
;   CloseWounds              Restoration  skill 50  level 25  -> 50%  (mid-game sustain)
Spell = CloseWounds|*Shaman|NONE|25/,16(50/)|-U/-C/-T|1|50!
;   Fear                     Illusion     skill 50  level 28  -> 45%  (crowd control)
Spell = Fear|*Shaman|NONE|28/,15(50/)|-U/-C/-T|1|45!
;   Ironflesh                Alteration   skill 60  level 35  -> 40%  (late-game defence)
Spell = Ironflesh|*Shaman|NONE|35/,12(60/)|-U/-C/-T|1|40!

; --- Vampire ---------------------------------------------------------
; Vampires get frost and drain only. Higher ranks should feel like predators, not like bandits with fangs.
;   Fear                     Illusion     skill 25  level 15  -> 50%  (predator opening)
Spell = Fear|*Vampire|NONE|15/,15(25/)|-U/-C/-T|1|50!
;   RaiseZombie              Conjuration  skill 40  level 25  -> 40%  (raises the bodies in the room)
Spell = RaiseZombie|*Vampire|NONE|25/,13(40/)|-U/-C/-T|1|40!
;   IceStorm                 Destruction  skill 45  level 28  -> 45%  (area frost)
Spell = IceStorm|*Vampire|NONE|28/,14(45/)|-U/-C/-T|1|45!
;   IcySpear                 Destruction  skill 65  level 45  -> 40%  (expert tier)
Spell = IcySpear|*Vampire|NONE|45/,14(65/)|-U/-C/-T|1|40!

; --- Pyromancer ---------------------------------------------------------
; Elemental specialists whose name already promises a full spell line.
;   Firebolt                 Destruction  skill 25  level 12  -> 70%  (fire line, tier 1)
Spell = Firebolt|*Pyromancer|NONE|12/,14(25/)|-U/-C/-T|1|70!
;   Fireball                 Destruction  skill 45  level 25  -> 60%  (fire line, tier 2)
Spell = Fireball|*Pyromancer|NONE|25/,14(45/)|-U/-C/-T|1|60!
;   Incinerate               Destruction  skill 65  level 40  -> 50%  (fire line, tier 3)
Spell = Incinerate|*Pyromancer|NONE|40/,14(65/)|-U/-C/-T|1|50!

; --- Cryomancer ---------------------------------------------------------
; Frost line, mirroring the pyromancer table.
;   IceSpike                 Destruction  skill 25  level 12  -> 70%  (frost line, tier 1)
Spell = IceSpike|*Cryomancer|NONE|12/,14(25/)|-U/-C/-T|1|70!
;   IceStorm                 Destruction  skill 45  level 25  -> 60%  (frost line, tier 2)
Spell = IceStorm|*Cryomancer|NONE|25/,14(45/)|-U/-C/-T|1|60!
;   IcySpear                 Destruction  skill 65  level 40  -> 50%  (frost line, tier 3)
Spell = IcySpear|*Cryomancer|NONE|40/,14(65/)|-U/-C/-T|1|50!

; --- Electromancer ---------------------------------------------------------
; Shock line, mirroring the pyromancer table.
;   LightningBolt            Destruction  skill 25  level 12  -> 70%  (shock line, tier 1)
Spell = LightningBolt|*Electromancer|NONE|12/,14(25/)|-U/-C/-T|1|70!
;   ChainLightning           Destruction  skill 45  level 25  -> 60%  (shock line, tier 2)
Spell = ChainLightning|*Electromancer|NONE|25/,14(45/)|-U/-C/-T|1|60!
;   Thunderbolt              Destruction  skill 65  level 40  -> 50%  (shock line, tier 3)
Spell = Thunderbolt|*Electromancer|NONE|40/,14(65/)|-U/-C/-T|1|50!

; 35 distribution lines in this preset.
