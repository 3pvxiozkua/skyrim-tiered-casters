; Tiered Casters 1.0.0 - Ruthless preset
; Everything arrives four levels earlier and almost always lands. Expect expert-tier spells in the thirties.
;
; Requires: Spell Perk Item Distributor (SPID) 7.x by powerofthree
;   https://www.nexusmods.com/skyrimspecialedition/mods/36869
; Install: drop this file into Skyrim Special Edition/Data (mod managers do it for you).
; Remove: delete this file. Nothing is written to your save.
;
; Line format:
;   Spell = <EditorID>|<string filters>|<form filters>|<level filters>|<traits>|<count>|<chance>
;   - string filters: NPC name or EditorID, * is a wildcard
;   - level filters : <level>/,<schoolIndex>(<skill>/)  -> both floors must be met
;   - traits        : -U not unique, -C not a child, -T not a teammate
;   - chance        : 0-100, the ! suffix makes the roll deterministic per NPC per save
;

; --- Necromancer ---------------------------------------------------------
; Vanilla necromancers lean on Conjuration and Destruction but only ever carry the opening spells of both schools.
;   ConjureFamiliar          Conjuration  skill 25  level 6   -> 88%  (first summon, so a fresh necromancer has a bodyguard)
Spell = ConjureFamiliar|*Necromancer|NONE|6/,13(25/)|-U/-C/-T|1|88!
;   Firebolt                 Destruction  skill 30  level 8   -> 88%  (replaces Flames as the default attack)
Spell = Firebolt|*Necromancer|NONE|8/,14(30/)|-U/-C/-T|1|88!
;   RaiseZombie              Conjuration  skill 40  level 14  -> 75%  (starts recycling the corpses the player leaves behind)
Spell = RaiseZombie|*Necromancer|NONE|14/,13(40/)|-U/-C/-T|1|75!
;   IceSpike                 Destruction  skill 40  level 16  -> 75%  (second element, so fights are not all fire)
Spell = IceSpike|*Necromancer|NONE|16/,14(40/)|-U/-C/-T|1|75!
;   ConjureFlameAtronach     Conjuration  skill 50  level 24  -> 69%  (mid-game summon)
Spell = ConjureFlameAtronach|*Necromancer|NONE|24/,13(50/)|-U/-C/-T|1|69!
;   Fireball                 Destruction  skill 55  level 26  -> 69%  (area pressure once Destruction is trained)
Spell = Fireball|*Necromancer|NONE|26/,14(55/)|-U/-C/-T|1|69!
;   Incinerate               Destruction  skill 70  level 41  -> 56%  (expert tier, reserved for late-game casters)
Spell = Incinerate|*Necromancer|NONE|41/,14(70/)|-U/-C/-T|1|56!

; --- Warlock ---------------------------------------------------------
; Shock specialists. Vanilla warlocks never get past Lightning Bolt, and they never use the armour spells their Alteration skill pays for.
;   LightningBolt            Destruction  skill 30  level 6   -> 88%  (core attack)
Spell = LightningBolt|*Warlock|NONE|6/,14(30/)|-U/-C/-T|1|88!
;   Stoneflesh               Alteration   skill 30  level 10  -> 69%  (survives the first arrow volley)
Spell = Stoneflesh|*Warlock|NONE|10/,12(30/)|-U/-C/-T|1|69!
;   ChainLightning           Destruction  skill 50  level 22  -> 69%  (punishes players who bring followers)
Spell = ChainLightning|*Warlock|NONE|22/,14(50/)|-U/-C/-T|1|69!
;   Ironflesh                Alteration   skill 55  level 30  -> 56%  (armour spell upgrade)
Spell = Ironflesh|*Warlock|NONE|30/,12(55/)|-U/-C/-T|1|56!
;   Thunderbolt              Destruction  skill 70  level 41  -> 56%  (expert tier)
Spell = Thunderbolt|*Warlock|NONE|41/,14(70/)|-U/-C/-T|1|56!

; --- Conjurer ---------------------------------------------------------
; Pure summoners. Their whole identity is the summon list, and vanilla stops it at Flame Atronach.
;   ConjureFamiliar          Conjuration  skill 25  level 4   -> 94%  (always-on opening summon)
Spell = ConjureFamiliar|*Conjurer|NONE|4/,13(25/)|-U/-C/-T|1|94!
;   ConjureFlameAtronach     Conjuration  skill 40  level 14  -> 75%  (second summon tier)
Spell = ConjureFlameAtronach|*Conjurer|NONE|14/,13(40/)|-U/-C/-T|1|75!
;   ConjureFrostAtronach     Conjuration  skill 55  level 24  -> 62%  (third summon tier)
Spell = ConjureFrostAtronach|*Conjurer|NONE|24/,13(55/)|-U/-C/-T|1|62!
;   ConjureStormAtronach     Conjuration  skill 70  level 36  -> 50%  (top summon tier)
Spell = ConjureStormAtronach|*Conjurer|NONE|36/,13(70/)|-U/-C/-T|1|50!

; --- Forsworn Shaman ---------------------------------------------------------
; Reach shamans are Restoration/Illusion casters in the lore and single-school spell plinkers in the game.
;   Oakflesh                 Alteration   skill 25  level 4   -> 69%  (cheap early defence)
Spell = Oakflesh|*Shaman|NONE|4/,12(25/)|-U/-C/-T|1|69!
;   FastHealing              Restoration  skill 25  level 6   -> 81%  (heals through the first burst of damage)
Spell = FastHealing|*Shaman|NONE|6/,16(25/)|-U/-C/-T|1|81!
;   Fury                     Illusion     skill 25  level 8   -> 69%  (turns the camp against itself)
Spell = Fury|*Shaman|NONE|8/,15(25/)|-U/-C/-T|1|69!
;   CloseWounds              Restoration  skill 50  level 21  -> 62%  (mid-game sustain)
Spell = CloseWounds|*Shaman|NONE|21/,16(50/)|-U/-C/-T|1|62!
;   Fear                     Illusion     skill 50  level 24  -> 56%  (crowd control)
Spell = Fear|*Shaman|NONE|24/,15(50/)|-U/-C/-T|1|56!
;   Ironflesh                Alteration   skill 60  level 31  -> 50%  (late-game defence)
Spell = Ironflesh|*Shaman|NONE|31/,12(60/)|-U/-C/-T|1|50!

; --- Vampire ---------------------------------------------------------
; Vampires get frost and drain only. Higher ranks should feel like predators, not like bandits with fangs.
;   Fear                     Illusion     skill 25  level 11  -> 62%  (predator opening)
Spell = Fear|*Vampire|NONE|11/,15(25/)|-U/-C/-T|1|62!
;   RaiseZombie              Conjuration  skill 40  level 21  -> 50%  (raises the bodies in the room)
Spell = RaiseZombie|*Vampire|NONE|21/,13(40/)|-U/-C/-T|1|50!
;   IceStorm                 Destruction  skill 45  level 24  -> 56%  (area frost)
Spell = IceStorm|*Vampire|NONE|24/,14(45/)|-U/-C/-T|1|56!
;   IcySpear                 Destruction  skill 65  level 41  -> 50%  (expert tier)
Spell = IcySpear|*Vampire|NONE|41/,14(65/)|-U/-C/-T|1|50!

; --- Pyromancer ---------------------------------------------------------
; Elemental specialists whose name already promises a full spell line.
;   Firebolt                 Destruction  skill 25  level 8   -> 88%  (fire line, tier 1)
Spell = Firebolt|*Pyromancer|NONE|8/,14(25/)|-U/-C/-T|1|88!
;   Fireball                 Destruction  skill 45  level 21  -> 75%  (fire line, tier 2)
Spell = Fireball|*Pyromancer|NONE|21/,14(45/)|-U/-C/-T|1|75!
;   Incinerate               Destruction  skill 65  level 36  -> 62%  (fire line, tier 3)
Spell = Incinerate|*Pyromancer|NONE|36/,14(65/)|-U/-C/-T|1|62!

; --- Cryomancer ---------------------------------------------------------
; Frost line, mirroring the pyromancer table.
;   IceSpike                 Destruction  skill 25  level 8   -> 88%  (frost line, tier 1)
Spell = IceSpike|*Cryomancer|NONE|8/,14(25/)|-U/-C/-T|1|88!
;   IceStorm                 Destruction  skill 45  level 21  -> 75%  (frost line, tier 2)
Spell = IceStorm|*Cryomancer|NONE|21/,14(45/)|-U/-C/-T|1|75!
;   IcySpear                 Destruction  skill 65  level 36  -> 62%  (frost line, tier 3)
Spell = IcySpear|*Cryomancer|NONE|36/,14(65/)|-U/-C/-T|1|62!

; --- Electromancer ---------------------------------------------------------
; Shock line, mirroring the pyromancer table.
;   LightningBolt            Destruction  skill 25  level 8   -> 88%  (shock line, tier 1)
Spell = LightningBolt|*Electromancer|NONE|8/,14(25/)|-U/-C/-T|1|88!
;   ChainLightning           Destruction  skill 45  level 21  -> 75%  (shock line, tier 2)
Spell = ChainLightning|*Electromancer|NONE|21/,14(45/)|-U/-C/-T|1|75!
;   Thunderbolt              Destruction  skill 65  level 36  -> 62%  (shock line, tier 3)
Spell = Thunderbolt|*Electromancer|NONE|36/,14(65/)|-U/-C/-T|1|62!

; 35 distribution lines in this preset.
