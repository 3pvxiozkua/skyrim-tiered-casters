; Tiered Casters 1.0.0 - Vanilla+ preset
; Same spell lists as vanilla for most of the game. Only the late-game casters get anything new, and only at reduced odds.
;
; Requires: Spell Perk Item Distributor (SPID) 7.x by powerofthree
;   https://www.nexusmods.com/skyrimspecialedition/mods/36869
; Install: drop this file into Skyrim Special Edition/Data (mod managers do it for you).
; Remove: delete this file. Nothing is written to your save.
;
; Line format:
;   Spell = <EditorID>|<string filters>|<form filters>|<level filters>|<traits>|<count>|<chance>
;   - string filters: NPC name or EditorID, * is a wildcard
;   - level filters : <level>/,<schoolIndex>(<skill>/)  -> both floors must be met
;   - traits        : -U not unique, -C not a child, -T not a teammate
;   - chance        : 0-100, the ! suffix makes the roll deterministic per NPC per save
;

; --- Necromancer ---------------------------------------------------------
; Vanilla necromancers lean on Conjuration and Destruction but only ever carry the opening spells of both schools.
;   ConjureFamiliar          Conjuration  skill 25  level 16  -> 52%  (first summon, so a fresh necromancer has a bodyguard)
Spell = ConjureFamiliar|*Necromancer|NONE|16/,13(25/)|-U/-C/-T|1|52!
;   Firebolt                 Destruction  skill 30  level 18  -> 52%  (replaces Flames as the default attack)
Spell = Firebolt|*Necromancer|NONE|18/,14(30/)|-U/-C/-T|1|52!
;   RaiseZombie              Conjuration  skill 40  level 24  -> 45%  (starts recycling the corpses the player leaves behind)
Spell = RaiseZombie|*Necromancer|NONE|24/,13(40/)|-U/-C/-T|1|45!
;   IceSpike                 Destruction  skill 40  level 26  -> 45%  (second element, so fights are not all fire)
Spell = IceSpike|*Necromancer|NONE|26/,14(40/)|-U/-C/-T|1|45!

; --- Warlock ---------------------------------------------------------
; Shock specialists. Vanilla warlocks never get past Lightning Bolt, and they never use the armour spells their Alteration skill pays for.
;   LightningBolt            Destruction  skill 30  level 16  -> 52%  (core attack)
Spell = LightningBolt|*Warlock|NONE|16/,14(30/)|-U/-C/-T|1|52!
;   Stoneflesh               Alteration   skill 30  level 20  -> 41%  (survives the first arrow volley)
Spell = Stoneflesh|*Warlock|NONE|20/,12(30/)|-U/-C/-T|1|41!

; --- Conjurer ---------------------------------------------------------
; Pure summoners. Their whole identity is the summon list, and vanilla stops it at Flame Atronach.
;   ConjureFamiliar          Conjuration  skill 25  level 14  -> 56%  (always-on opening summon)
Spell = ConjureFamiliar|*Conjurer|NONE|14/,13(25/)|-U/-C/-T|1|56!
;   ConjureFlameAtronach     Conjuration  skill 40  level 24  -> 45%  (second summon tier)
Spell = ConjureFlameAtronach|*Conjurer|NONE|24/,13(40/)|-U/-C/-T|1|45!

; --- Forsworn Shaman ---------------------------------------------------------
; Reach shamans are Restoration/Illusion casters in the lore and single-school spell plinkers in the game.
;   Oakflesh                 Alteration   skill 25  level 14  -> 41%  (cheap early defence)
Spell = Oakflesh|*Shaman|NONE|14/,12(25/)|-U/-C/-T|1|41!
;   FastHealing              Restoration  skill 25  level 16  -> 49%  (heals through the first burst of damage)
Spell = FastHealing|*Shaman|NONE|16/,16(25/)|-U/-C/-T|1|49!
;   Fury                     Illusion     skill 25  level 18  -> 41%  (turns the camp against itself)
Spell = Fury|*Shaman|NONE|18/,15(25/)|-U/-C/-T|1|41!

; --- Vampire ---------------------------------------------------------
; Vampires get frost and drain only. Higher ranks should feel like predators, not like bandits with fangs.
;   Fear                     Illusion     skill 25  level 21  -> 38%  (predator opening)
Spell = Fear|*Vampire|NONE|21/,15(25/)|-U/-C/-T|1|38!
;   RaiseZombie              Conjuration  skill 40  level 31  -> 30%  (raises the bodies in the room)
Spell = RaiseZombie|*Vampire|NONE|31/,13(40/)|-U/-C/-T|1|30!

; --- Pyromancer ---------------------------------------------------------
; Elemental specialists whose name already promises a full spell line.
;   Firebolt                 Destruction  skill 25  level 18  -> 52%  (fire line, tier 1)
Spell = Firebolt|*Pyromancer|NONE|18/,14(25/)|-U/-C/-T|1|52!
;   Fireball                 Destruction  skill 45  level 31  -> 45%  (fire line, tier 2)
Spell = Fireball|*Pyromancer|NONE|31/,14(45/)|-U/-C/-T|1|45!

; --- Cryomancer ---------------------------------------------------------
; Frost line, mirroring the pyromancer table.
;   IceSpike                 Destruction  skill 25  level 18  -> 52%  (frost line, tier 1)
Spell = IceSpike|*Cryomancer|NONE|18/,14(25/)|-U/-C/-T|1|52!
;   IceStorm                 Destruction  skill 45  level 31  -> 45%  (frost line, tier 2)
Spell = IceStorm|*Cryomancer|NONE|31/,14(45/)|-U/-C/-T|1|45!

; --- Electromancer ---------------------------------------------------------
; Shock line, mirroring the pyromancer table.
;   LightningBolt            Destruction  skill 25  level 18  -> 52%  (shock line, tier 1)
Spell = LightningBolt|*Electromancer|NONE|18/,14(25/)|-U/-C/-T|1|52!
;   ChainLightning           Destruction  skill 45  level 31  -> 45%  (shock line, tier 2)
Spell = ChainLightning|*Electromancer|NONE|31/,14(45/)|-U/-C/-T|1|45!

; 19 distribution lines in this preset.
